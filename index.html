<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindPrint — Know yourself through games</title>
  <meta name="description" content="Play 8 short neuroscience-style games and get a profile of how you think, decide and work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%236d5dfc'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand" id="brand"><span class="logo"></span>MindPrint</a>
    <nav>
      <button class="link" id="nav-games">Games</button>
      <button class="link" id="nav-profile">My profile</button>
    </nav>
  </header>
  <main id="app" class="container"></main>
  <footer class="footer">
    MindPrint is a self-discovery tool inspired by behavioural-science games. It is not a validated psychometric or hiring assessment.
    Profiles are saved on this device; results are only emailed when you ask.
  </footer>
  <script src="app.js"></script>
</body>
</html>
